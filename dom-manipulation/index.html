<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <!-- Category Filter Section -->
  <div class="controls">
    <label for="categoryFilter">Filter by Category:</label>
    <select id="categoryFilter" onchange="filterQuotes()">
      <option value="all">All Categories</option>
      <!-- Categories will be added dynamically from JavaScript -->
    </select>
  </div>


<div id="conflictNotice" class="conflict-notice" style="display:none;">
  <p>⚠️ Some quotes were updated on the server. 
  <button id="resolveConflictBtn">Review</button></p>
</div>


  <!-- Quote Display Section -->
  <div id="quoteDisplay" class="quote-box"></div>

<!-- Category Selection for Random Quote -->
<div class="controls">
  <label for="categorySelect">Select Category for Random Quote:</label>
  <select id="categorySelect">
    <option value="motivation">Motivation</option>
    <option value="love">Love</option>
    <option value="humor">Humor</option>
  </select>
</div>


  <!-- Show New Quote Button -->
  <button id="newQuote">Show New Quote</button>

  <!-- Add New Quote Section -->
  <section class="add-quote">
    <h2>Add a New Quote</h2>
    <input id="newQuoteText" type="text" placeholder="Enter a new quote" />
    <input id="newQuoteCategory" type="text" placeholder="Enter quote category" />
    <button onclick="addQuote()">Add Quote</button>
  </section>

  <!-- JSON Import/Export Section -->
  <hr>
  <h3>Import / Export Quotes</h3>
  <button id="exportQuotes">Export Quotes (JSON)</button>
  <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />

  <script src="script.js"></script>
</body>
</html>
